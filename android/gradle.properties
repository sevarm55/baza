org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Адрес боевого сервера. Тот же, что в `ios/Tetr/Core/API.swift`.
#
# Отладочная сборка сюда НЕ ходит: у неё свой адрес (см. app/build.gradle.kts).
# Обратное означало бы, что проверка нового экрана идёт по живым клиентам —
# заводит им машины и портит зарплату за месяц. Такую ошибку нельзя заметить
# вовремя, потому что выглядит она как работающее приложение.
tetrin.api.production=https://tetrin.pro/api/v1/

# Куда ходит отладочная сборка: локальный сервер на машине разработчика,
# доставленный на устройство пробросом порта.
#
#     adb reverse tcp:3311 tcp:3100
#
# Именно 127.0.0.1, а НЕ 10.0.2.2. Второй адрес — это «машина разработчика»
# с точки зрения эмулятора, и только его: на живом телефоне такого адреса
# нет вовсе, и сборка с ним молча показывает «нет связи» на каждом экране.
# Отличить это от настоящего обрыва нельзя ничем, кроме как вспомнив, чем
# собирали. Проброс же работает одинаково и на эмуляторе, и на телефоне —
# поэтому адрес здесь один на оба случая, и промахнуться больше нечем.
#
# Проброс живёт, пока держится соединение с adb: после передёргивания
# кабеля его надо поставить заново — приложение при этом ничего не знает и
# честно сообщает, что связи нет.
#
# Телефону в одной сети с компьютером проброс не нужен, там прямой адрес —
# tetrin.api.development=http://192.168.1.5:3100/api/v1/
tetrin.api.development=http://127.0.0.1:3311/api/v1/
