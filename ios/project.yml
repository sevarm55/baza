# Проект описан файлом, а не .xcodeproj.
#
# Причина простая: pbxproj — это бинарный по смыслу формат, в котором
# конфликт слияния читать невозможно, а решать приходится вручную. Здесь
# же вся сборка в двадцати строках, и `xcodegen generate` пересоздаёт
# проект из них в любой момент.
#
# Сам .xcodeproj в git не лежит — он собирается.

name: Tetr
options:
  bundleIdPrefix: com.sevarm
  deploymentTarget:
    # 26, а не 16: Liquid Glass существует только здесь. Цена известна —
    # телефоны старше остаются без приложения, и для мойщиков это заметная
    # доля. Веб при этом никуда не делся и работает на всём.
    iOS: "26.0"
  createIntermediateGroups: true
  # .icon — это папка, которая притворяется файлом. Xcode 26 понимает её
  # как иконку целиком; xcodegen без этой строчки раскладывает её на
  # составные части, и тогда иконки в сборке просто нет — молча, без
  # ошибки. Внешне выглядит как «Icon Composer не сработал».
  fileTypes:
    icon:
      file: true

settings:
  base:
    # Язык 5, а не 6: строгая многопоточность Swift 6 требует расставить
    # изоляцию по всему коду сразу, а это отдельная работа и отдельный
    # риск. Переключить можно потом, одной строкой.
    SWIFT_VERSION: "5.0"
    # Совпадает с номером версии в App Store Connect. Не совпадёт —
    # загруженная сборка прицепится к другой версии и в списке для
    # отправки её просто не будет.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Команда разработчика. Здесь, а не в настройках Xcode: .xcodeproj
    # пересоздаётся из этого файла, и выставленное мышкой пропало бы при
    # первом же `xcodegen generate`.
    DEVELOPMENT_TEAM: LA27673455
    CODE_SIGN_STYLE: Automatic

targets:
  Tetr:
    type: application
    platform: iOS
    sources:
      - path: Tetr
      - path: Shared
    # Info.plist генерируется отсюда. Не через INFOPLIST_KEY_*: фоновые
    # режимы и список разрешённых фоновых задач в тот механизм не входят,
    # а без них система задачу просто не запустит.
    info:
      path: Tetr/Info.plist
      properties:
        # Латиницей, как и в App Store. Имя на устройстве и имя в витрине
        # должны совпадать — иначе человек не находит установленное
        # приложение, а Apple это отдельно проверяет.
        CFBundleDisplayName: Tetrin
        # Запасное короткое имя. Система берёт его там, где полное не
        # помещается, и без этой строки туда попадало бы имя цели сборки —
        # Tetr. Целиком её переименовывать незачем: она невидима, а следом
        # поехали бы схема, пути и конфигурация.
        CFBundleName: Tetrin
        # Полотно, которое система рисует до того, как приложение получило
        # управление. Пустой словарь давал белое — и на холодном старте
        # человек видел белую вспышку, а следом тёмную заставку. Цвет
        # совпадает с первым кадром ролика, поэтому вспышки больше нет:
        # экран сразу тёмный и таким остаётся.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Локальный сервер для проверки: без этого отладочная сборка может
        # ходить только в прод, то есть по живым клиентам. Разрешение
        # касается ровно localhost и в магазинную сборку не влияет ни на
        # что — туда приложение ходит по HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Экран записи живёт вертикально: мойщик держит телефон одной рукой
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Шифрование только стандартное — HTTPS и Keychain. Без этого
        # ключа Xcode спрашивает про экспортный контроль при каждой
        # отправке сборки, и однажды на него ответят наугад.
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Համարանիշը սկանավորելու համար
        NSFaceIDUsageDescription: Որպեսզի PIN-ը ամեն անգամ չհավաքեք
        # Досылка очереди, когда приложение закрыто
        UIBackgroundModes: [processing]
        # Разрешение на уведомления спрашивается в приложении, но система
        # хочет видеть право на них здесь
        NSUserNotificationsUsageDescription: Որպեսզի իմանաք հերթափոխի և նոր գրանցումների մասին
        # Открытая смена живёт на Lock Screen и в Dynamic Island.
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers: [com.sevarm.tetr.flush]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sevarm.tetr
        # Только iPhone. По умолчанию Xcode ставит iPhone+iPad, и тогда
        # Apple требует все четыре ориентации ради многозадачности на
        # планшете — сборка не проходит проверку. Добавлять их значило бы
        # обещать то, чего нет: экран мойщика держат одной рукой, сканер
        # номеров вертикальный, а таблицы на десяти дюймах никто не сверял.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Tetr/Tetr.entitlements
        # Имя файла AppIcon.icon без расширения. Каталога ассетов у нас
        # нет и не нужно: цель — iOS 26, а там иконка живёт одним .icon,
        # из которого система сама делает светлую, тёмную и тонированную.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      # WidgetKit extension содержит только системное представление
      # открытой смены; приложение управляет её жизненным циклом.
      - target: TetrWidgets

  TetrWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TetrWidgets
      - path: Shared
    info:
      path: TetrWidgets/Info.plist
      properties:
        CFBundleDisplayName: Tetrin Live
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sevarm.tetr.widgets
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  # Проход по экранам касаниями. Смоук и e2e проверяют сервер и данные;
  # здесь проверяется то, чего они не видят: что до кнопки можно
  # дотянуться и что поле принимает ввод. Поломки такого рода выглядят
  # как «на сервере всё правильно, а работать невозможно».
  TetrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TetrUITests
    dependencies:
      - target: Tetr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sevarm.tetr.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tetr

# Схема описана здесь, а не оставлена Xcode на автосоздание, ровно ради
# одной строки — адреса сервера. Кнопка Run обязана вести на свой
# компьютер: отладочная сборка, ушедшая в прод, заводит машины живым
# мойкам, и заметно это станет через месяц, при сверке зарплат.
#
# Само умолчание живёт в коде (`API.swift`, `development`), здесь оно
# продублировано затем, чтобы человек нашёл его глазами: Product → Scheme →
# Edit Scheme → Run → Arguments. Там же его меняют, когда сервер нужен
# другой:
#
#   http://192.168.1.5:3100/api/v1/   телефон в одной сети с компьютером
#   prod                              осознанно по бою
schemes:
  Tetr:
    build:
      targets:
        Tetr: all
    run:
      config: Debug
      environmentVariables:
        - variable: TETR_API
          value: http://172.20.10.6:3100/api/v1/
          isEnabled: true
    test:
      config: Debug
      targets:
        - TetrUITests
      # Тесты идут по своему серверу, как и обычная отладочная сборка.
      # Прогон по бою заводил бы машины живым мойкам.
      environmentVariables:
        - variable: TETR_API
          value: http://172.20.10.6:3100/api/v1/
          isEnabled: true
    profile:
      config: Release
    analyze:
      config: Debug
    # Отправка в магазин собирается из Release, а там адрес один и
    # переменными не подменяется.
    archive:
      config: Release
