# ─────────────────────────────────────────────────────────────
#  Базис на своём VPS, рядом с чужим продакшном.
#
#  На сервере уже живёт giperstroy, и его Caddy держит порты 80/443.
#  Поэтому Базис наружу НЕ торчит вообще: он подключается к сети
#  giperstroy, и туда его пускает тот же Caddy по своему имени хоста.
#
#  Имена сервисов уникальные не для красоты: у соседа есть сервис `web`,
#  и второй `web` в той же сети сделал бы DNS неоднозначным — Caddy
#  соседа начал бы иногда попадать в наше приложение.
# ─────────────────────────────────────────────────────────────

name: bazis

services:
  bazis-postgres:
    image: postgres:17-alpine
    container_name: bazis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bazis
      POSTGRES_USER: bazis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нужен POSTGRES_PASSWORD в .env}
      # быстрее и безопаснее md5, ради этого и задаём явно
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bazis -d bazis']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bazis-internal

  bazis-web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: bazis/web:latest
    container_name: bazis-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://bazis:${POSTGRES_PASSWORD:?}@bazis-postgres:5432/bazis
      SESSION_SECRET: ${SESSION_SECRET:?нужен SESSION_SECRET в .env}
      # телефоны с доступом в /admin, через запятую. Список в окружении,
      # а не в базе: чтобы выдать себе админку, мало добраться до базы
      PLATFORM_ADMIN_PHONES: ${PLATFORM_ADMIN_PHONES:-}
      # абонементы клиентов спрятаны до отдельной проработки; оплата
      # продукта работает всегда, если явно не выключить нулём
      PASSES_ENABLED: ${PASSES_ENABLED:-}
      BILLING_ENABLED: ${BILLING_ENABLED:-1}
      # Пуш-уведомления. Ключ .p8 из кабинета Apple — целиком, вместе со
      # строками BEGIN/END. В .env переносы строк записываются как \n.
      # Пусто — уведомления просто не отправляются, всё остальное работает.
      APNS_KEY: ${APNS_KEY:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-com.sevarm.tetr}
      # Секрет для задач по расписанию. Пусто — маршрут отвечает 404, то
      # есть его как будто нет.
      CRON_SECRET: ${CRON_SECRET:-}
      # Адрес приложения в App Store. Пока пусто: приложение отправлено на
      # ревью, и числовой идентификатор появляется только с публикацией.
      # Витрина в этом случае показывает знак магазина без ссылки и
      # подписывает его «скоро». Впишут адрес — знак станет ссылкой сам,
      # без правки кода и без пересборки образа.
      APP_STORE_URL: ${APP_STORE_URL:-}
      # Отправка SMS с кодом подтверждения. Пусто — регистрация упрётся в
      # честный отказ: номер подтверждается кодом, и подтвердить его
      # нечем. Провайдер за одним интерфейсом, поэтому смена оператора —
      # это правка этих строк, а не выката (см. lib/sms.ts).
      SMS_ENDPOINT: ${SMS_ENDPOINT:-}
      SMS_TOKEN: ${SMS_TOKEN:-}
      SMS_AUTH_SCHEME: ${SMS_AUTH_SCHEME:-}
      SMS_SENDER: ${SMS_SENDER:-}
      SMS_BODY: ${SMS_BODY:-}
      # Именные провайдеры — если однажды переедем с D7.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      VONAGE_API_KEY: ${VONAGE_API_KEY:-}
      VONAGE_API_SECRET: ${VONAGE_API_SECRET:-}
      VONAGE_FROM: ${VONAGE_FROM:-}
      # Разные секреты для разных задач: утечка одного не отдаёт второе.
      # Пусто — выводятся из SESSION_SECRET со своей меткой назначения и
      # с ним никогда не совпадают.
      OTP_SECRET: ${OTP_SECRET:-}
      DEVICE_SECRET: ${DEVICE_SECRET:-}
      # Свой домен и разрешённые источники. Проверка источника работает и
      # без списка — она сверяет Origin с хостом запроса; список нужен
      # там, где наружный хост не совпадает с внутренним.
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-tetrin.pro}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # экземпляр один, поэтому миграции при старте безопасны
      MIGRATE_ON_START: '1'
    depends_on:
      bazis-postgres:
        condition: service_healthy
    networks:
      bazis-internal:
      # сеть соседа — единственный способ пустить сюда его Caddy
      giperstroy:
        aliases:
          - bazis-web

networks:
  bazis-internal:
  giperstroy:
    external: true

volumes:
  postgres_data:
